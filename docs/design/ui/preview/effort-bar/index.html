<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案の見本</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2a2e}
#stage{position:fixed;inset:0;display:flex;justify-content:center}
iframe{border:0;width:100%;height:100%;background:#fff}
body.narrow iframe{width:375px}
#bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;max-width:calc(100vw - 24px);
  overflow-x:auto;padding:4px;border-radius:999px;background:rgba(20,20,22,.88);backdrop-filter:blur(10px);
  font:13px/1 system-ui,"Noto Sans JP",sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#bar button{all:unset;cursor:pointer;color:#c9c9cf;padding:9px 13px;border-radius:999px;white-space:nowrap}
#bar button:hover{color:#fff}
#bar button[aria-current=true]{background:#fff;color:#111}
#bar button:focus-visible{outline:2px solid #fff;outline-offset:1px}
#bar i{width:1px;margin:6px 3px;background:#55555c}
</style></head><body>
<div id="stage"><iframe id="view" title="見本"></iframe></div>
<nav id="bar" aria-label="案の切り替え"></nav>
<script>
const V=[{"name": "一色", "file": "ichishoku.html"}, {"name": "信号", "file": "shingou.html"}, {"name": "グラデーション", "file": "grad.html"}];
const view=document.getElementById('view'),bar=document.getElementById('bar');
let cur=Math.max(0,V.findIndex(v=>decodeURIComponent(location.hash.slice(1))===v.name));
function show(i){
  cur=(i+V.length)%V.length;view.src=V[cur].file;
  history.replaceState(null,'','#'+encodeURIComponent(V[cur].name));
  [...bar.querySelectorAll('[data-i]')].forEach(b=>b.setAttribute('aria-current',String(+b.dataset.i===cur)));
}
V.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.name;b.dataset.i=i;b.onclick=()=>show(i);bar.append(b)});
bar.append(document.createElement('i'));
const add=(t,l,f)=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-label',l);b.onclick=f;bar.append(b)};
const narrow=()=>document.body.classList.toggle('narrow'),again=()=>{view.src=V[cur].file};
add('375','幅375で表示 (M)',narrow);add('↻','読み直す (R)',again);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);
  else if(e.key==='m'||e.key==='M')narrow();else if(e.key==='r'||e.key==='R')again();
  else if(+e.key>=1&&+e.key<=V.length)show(+e.key-1);
});
view.addEventListener('load',()=>{try{view.contentWindow.addEventListener('keydown',e=>dispatchEvent(new KeyboardEvent('keydown',{key:e.key})))}catch{}});
show(cur);
</script></body></html>
